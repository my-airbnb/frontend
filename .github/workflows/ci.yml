name: CI - frontend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ---- 1. SAST with Semgrep ----
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript

  # ---- 2. Dependency Scan ----
  dependency-scan:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-
      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          cache-dir: ~/.cache/trivy

  # ---- 3. Build, Scan & Push (develop + main only) ----
  # Merged container-scan + push-to-ghcr to avoid building the Docker image twice.
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          cache-dir: ~/.cache/trivy

      - name: Push to GHCR
        run: |
          IMAGE=ghcr.io/my-airbnb/frontend:${{ steps.tag.outputs.TAG }}
          docker tag frontend:${{ github.sha }} $IMAGE
          docker push $IMAGE

  # ---- 4. Update K8s Manifest ----
  update-k8s-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: my-airbnb/k8s-manifests
          token: ${{ secrets.GH_PAT }}
          ref: infra

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Update deployment image
        run: |
          sed -i "s|image: ghcr.io/my-airbnb/frontend:.*|image: ghcr.io/my-airbnb/frontend:${{ steps.tag.outputs.TAG }}|" apps/frontend/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/deployment.yaml
          git commit -m "chore: update frontend image to ${{ steps.tag.outputs.TAG }}"
          git pull --rebase origin infra
          git push
