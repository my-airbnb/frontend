name: CI - frontend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ---- 1. SAST with Semgrep ----
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript

  # ---- 2. Dependency Scan ----
  dependency-scan:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  # ---- 3. Container Scan (develop + main only) ----
  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t frontend:${{ github.sha }} .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

  # ---- 4. Push to GHCR ----
  push-to-ghcr:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Build & Push to GHCR
        run: |
          IMAGE=ghcr.io/my-airbnb/frontend:${{ steps.tag.outputs.TAG }}
          docker build -t $IMAGE .
          docker push $IMAGE

  # ---- 5. Update K8s Manifest ----
  update-k8s-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: push-to-ghcr
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: my-airbnb/k8s-manifests
          token: ${{ secrets.GH_PAT }}
          ref: infra

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Update deployment image
        run: |
          sed -i "s|image: ghcr.io/my-airbnb/frontend:.*|image: ghcr.io/my-airbnb/frontend:${{ steps.tag.outputs.TAG }}|" apps/frontend/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/deployment.yaml
          git commit -m "chore: update frontend image to ${{ steps.tag.outputs.TAG }}"
          git pull --rebase origin infra
          git push
